[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "EventHazardNet"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=2", "pandas", "scipy", "scikit-learn", "torch", "matplotlib", "psutil"]
[project.scripts]
eventhazardnet = "eventhazardnet:main"
[tool.setuptools]
py-modules = ["eventhazardnet"]
